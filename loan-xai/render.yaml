# Render Blueprint Specification (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service: FastAPI Python REST API & Decision Engine
  # ---------------------------------------------------------------------------
  - type: web
    name: loan-xai-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site: React Vite Single Page Application
  # ---------------------------------------------------------------------------
  - type: static
    name: loan-xai-frontend
    plan: free
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: loan-xai-backend
          property: host
